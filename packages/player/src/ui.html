<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dolly player</title>
<style>
  :root {
    --bg: #0f1013; --panel: #16181d; --line: #262931; --text: #d8dbe2; --dim: #8b909c; --accent: #6d8bff; --warn: #ffb547; --err: #ff6363;
    --scene-a: #2a3350; --scene-b: #3a2a50; --mark: #ffd166; --cut: #ff7a7a;
    font: 500 12.5px/1.35 "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr auto auto; height: 100vh; }
  header { display: flex; align-items: center; gap: 14px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 13px; margin: 0; font-weight: 700; color: #fff; }
  .tc { font: 600 13px ui-monospace, Consolas, monospace; color: #fff; min-width: 210px; }
  .tc small { color: var(--dim); font-weight: 500; }
  .grp { display: flex; align-items: center; gap: 4px; }
  .grp > span { color: var(--dim); margin-right: 2px; }
  button, select { background: #20232a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3a3e48; }
  button.on { background: #2a3566; border-color: var(--accent); color: #fff; }
  .spacer { flex: 1; }
  #status { color: var(--dim); }
  #status.err { color: var(--err); }
  main { position: relative; min-height: 0; display: grid; place-items: center; background: #08090b; }
  #viewport { position: relative; box-shadow: 0 0 0 1px var(--line); background: #000; }
  #viewport iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #error { position: absolute; left: 16px; right: 16px; bottom: 16px; padding: 10px 12px; background: #2a1215; border: 1px solid #5a2228; color: #ffb3b3; border-radius: 8px; font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; display: none; max-height: 40%; overflow: auto; }
  #timeline { display: block; width: 100%; height: 168px; cursor: pointer; background: var(--panel); border-top: 1px solid var(--line); }
  footer { padding: 5px 12px; color: var(--dim); border-top: 1px solid var(--line); background: var(--panel); font-size: 11.5px; display: flex; gap: 16px; flex-wrap: wrap; }
  footer b { color: var(--text); font-weight: 600; }
  #drop { position: fixed; inset: 0; background: rgba(109,139,255,.12); border: 2px dashed var(--accent); display: none; place-items: center; font-size: 16px; color: #fff; z-index: 10; }
</style>
<header>
  <h1 id="title">dolly</h1>
  <div class="tc" id="tc">0.000 s <small>f0 · –</small></div>
  <div class="grp"><button id="play" title="Space">▶</button><button id="stepb" title="←">⟨</button><button id="stepf" title="→">⟩</button></div>
  <div class="grp"><span>speed</span><select id="rate"><option>0.1</option><option>0.25</option><option>0.5</option><option>0.75</option><option selected>1</option></select></div>
  <div class="grp"><span>loop</span><button id="loopScene" title="L">scene</button><button id="loopIn" title="I">in</button><button id="loopOut" title="O">out</button><button id="loopClear" title="X">×</button></div>
  <div class="grp"><span>aspect</span><select id="aspect"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option></select></div>
  <div class="grp"><span>overlays</span>
    <button data-ov="safe" title="S">safe</button><button data-ov="grid" title="G">thirds</button><button data-ov="bounds" title="B">bounds</button>
    <button data-ov="camera" title="C">camera</button><button data-ov="paths" title="M">paths</button><button data-ov="heat" title="H">velocity</button>
  </div>
  <div class="grp"><button id="snap" title="beat snap while scrubbing">snap ♩</button><button id="copy" title="copy a link to this moment">link</button></div>
  <div class="spacer"></div>
  <div id="status">loading…</div>
</header>
<main>
  <div id="viewport"><iframe id="frame"></iframe><canvas id="overlay"></canvas></div>
  <div id="error"></div>
</main>
<canvas id="timeline"></canvas>
<footer>
  <span><b>Space</b> play</span><span><b>←/→</b> frame</span><span><b>⇧←/→</b> ±1 s</span><span><b>[ ]</b> markers</span>
  <span><b>L</b> loop scene</span><span><b>I/O</b> in/out</span><span><b>X</b> clear loop</span><span><b>1–5</b> speed</span>
  <span><b>S G B C M H</b> overlays</span><span>drop audio files to add tracks · drag clips to align</span>
</footer>
<div id="drop">drop audio (music / VO)</div>
<script src="/player.js"></script>
</html>
